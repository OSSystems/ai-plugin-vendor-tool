[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-plugin-vendor-tool"
version = "0.1.0"
description = "Vendor Claude Code plugin skills from upstream GitHub repos with lockfile and NOTICE generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Otavio Salvador", email = "otavio.salvador@gmail.com" }]
keywords = [
  "claude-code",
  "plugin",
  "vendoring",
  "skills",
  "github",
  "lockfile",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Software Distribution",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/OSSystems/ai-plugin-vendor-tool"
Source = "https://github.com/OSSystems/ai-plugin-vendor-tool"
Issues = "https://github.com/OSSystems/ai-plugin-vendor-tool/issues"
Changelog = "https://github.com/OSSystems/ai-plugin-vendor-tool/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "pyright>=1.1.350", "ruff>=0.6"]
test = ["pytest>=8"]
lint = ["pyright>=1.1.350", "ruff>=0.6"]

[project.scripts]
ai-plugin-vendor-tool = "ai_plugin_vendor_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_plugin_vendor_tool = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "RET", # return
  "PTH", # use-pathlib
  "RUF", # ruff-specific
]
# Tests deliberately use bare asserts and pytest.raises shapes that some
# bugbear rules flag.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"
reportMissingTypeStubs = false
# Tests stay at "basic" because pytest fixtures arrive unannotated; src is
# checked at strict via the per-path override below.
typeCheckingMode = "basic"
strict = ["src"]
