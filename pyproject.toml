[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-plugin-vendor-tool"
version = "0.1.0"
description = "Vendor Claude Code plugin skills from upstream GitHub repos with lockfile and NOTICE generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Otavio Salvador" }]
keywords = ["claude-code", "plugin", "vendoring", "skills"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[project.scripts]
ai-plugin-vendor-tool = "ai_plugin_vendor_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_plugin_vendor_tool = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = ["src"]
explicit_package_bases = true
namespace_packages = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
# Strictness ratchets up after each module gets typed; see TODO list in
# docs/roadmap.md. Final goal is `strict = true`.

[[tool.mypy.overrides]]
module = "tests.*"
# Tests build dataclasses through helpers and pass dicts as fixtures; relax
# until the test suite is fully annotated.
disallow_untyped_defs = false
disallow_incomplete_defs = false
